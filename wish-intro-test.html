<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fdf9ee" />
    <title>許願引言實驗 — The Wizard’s GENESIS</title>
  </head>
  <body>
    <main class="wi-page">
      <header class="wi-masthead"><span>The Wizard’s GENESIS</span><span>許願引言 · 實驗頁</span></header>
      <div class="wi-thread" aria-hidden="true"></div>
      <section class="wi-opening">
        <div class="wi-earth" aria-hidden="true"><i></i></div>
        <div class="wi-copy">
          <p class="wi-lead">在地球上，人們有許多許願的方式。</p>
          <p>向劃過夜空的流星、生日蛋糕上的蠟燭，或是投入噴泉的一枚硬幣⋯⋯</p>
        </div>
        <span class="wi-scroll" aria-hidden="true">慢慢往下，讓心願繼續<span></span></span>
      </section>
      <section class="wi-reason">
        <div class="wi-dots" aria-hidden="true"></div>
        <p class="wi-copy">當然，這些事物本身並沒有實現願望的魔力。</p>
      </section>
      <section class="wi-turn">
        <div class="wi-orbit" aria-hidden="true"><i></i><b>✦</b></div>
        <p class="wi-copy">但如果真的有魔法存在呢？</p>
      </section>
      <section class="wi-distance">
        <div class="wi-window" aria-hidden="true"><span></span></div>
        <p class="wi-copy">如果那些遙不可及的心願，真的有機會被天球上的某個人聽見呢？</p>
      </section>
      <section class="wi-invitation">
        <p class="wi-copy">嗯……既然都來到這裡了，不妨試試看吧！</p>
      </section>
      <section class="wi-so"><p>所以⋯⋯</p><span aria-hidden="true"></span></section>
      <section class="wi-wish">
        <div class="wi-wish-ring" aria-hidden="true"></div>
        <div class="wi-copy">
          <span class="wi-emblem" aria-hidden="true">✦</span>
          <h1>許個願望吧！</h1>
          <p>說不定魔法師們能接收到並實現你的願望喔！</p>
          <div class="wi-letter" aria-hidden="true"><span></span><i>✧</i></div>
          <small>銜接展示 · 心願暫時留在這裡</small>
        </div>
      </section>
      <footer>THE WIZARD’S GENESIS <span>許願引言實驗 · 僅供預覽</span></footer>
    </main>
    <script type="module" src="/src/experiments/wish-intro/main.js"></script>
  </body>
</html>
